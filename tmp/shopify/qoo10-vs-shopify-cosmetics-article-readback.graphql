query ArticleById($id: ID!) {
  article(id: $id) {
    id
    title
    handle
    isPublished
    body
    summary
    tags
    author {
      name
    }
    blog {
      id
      handle
      title
    }
    metafield(namespace: "global", key: "description_tag") {
      type
      value
    }
  }
}
