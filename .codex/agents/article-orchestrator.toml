name = "article-orchestrator"
description = "メインのCodexが参照する記事制作の進行手順。中央指揮サブエージェントとしては起動しない。"
developer_instructions = """
これはメインのCodexが参照する進行手順の補助です。中央指揮と工程の実行判断はメインが担い、この定義を中央指揮サブエージェントとして起動しません。工程、停止条件、成果物契約は `AGENTS.md` が唯一の正本です。

## new-article の既定動作
1. キーワード未指定時だけ `keyword-strategist` を実行する。
   - 投稿先ブログが未指定ならメインが主題から選び、キーワードとともにdesignerへ渡す。
2. `article-designer` → `fact-checker (pre-write)` → `article-writer` → `fact-checker (post-write)` → 必要時の `content-asset-planner` → `japanese-editor` の順に実行する。
3. `japanese-quality-reviewer` を起動し、流暢さ、段落論理、用語、リズム、文体統一を独立採点する。合格は総合95点以上かつ全軸90点以上。結果は `drafts/<handle>-japanese-review.md` に保存させる。
4. 日本語品質が不合格なら、意味を変えない文章調整は `japanese-editor`、タイトル・メタ・構成・主張の修正は `article-writer` に差し戻す。`article-writer` が編集した場合は `fact-checker (post-write)` → `japanese-editor` → `japanese-quality-reviewer`、`japanese-editor` だけが編集した場合も `japanese-quality-reviewer` を必ず再実行する。最大3周で停止する。
5. 日本語品質合格後に `article-reviewer` を1回起動し、SEO、読者/E-E-A-T、独自性/非定型性、UX/可読性の4軸をまとめて採点する。合格は総合95点以上かつ全軸90点以上。結果は `drafts/<handle>-review.md` に保存させる。
6. 品質不合格なら `article-writer` に具体的な指摘を渡し、`fact-checker (post-write)` → `japanese-editor` → `japanese-quality-reviewer` → `article-reviewer` を必ず再実行する。最大3周で停止する。
7. 品質合格後に `legal-reviewer` を実行し、結果を `drafts/<handle>-legal-review.md` に保存させる。95点未満または高リスクが1件でもあれば `article-writer` に差し戻し、`fact-checker (post-write)` → `japanese-editor` → `japanese-quality-reviewer` → `article-reviewer` → `legal-reviewer` を必ず再実行する。最大3周で停止する。
8. `python3 scripts/article_validator.py --allow-draft-placeholders drafts/<handle>.html` が合格してから `drive-draft-saver` を `new_article` モードで実行する。
9. `drive-draft-saver` の `drafts/<handle>-drive.md` が `passed` なら、Google Drive URL、file ID、readback結果を報告して完了する。これが通常依頼の自動実行終点である。
   - `needs_human_input` なら保存先と未解決事項を報告する。保存済みでも完成稿とは扱わず、Shopify工程へ進めない。

## Shopify下書きの条件
- ユーザーがShopify下書き作成を明示的に依頼した場合だけ、`drafts/<handle>-drive.md` が `passed` であることを確認する。メインがAGENTS.mdの「Shopify Input Preparation」に従って `drafts/<handle>-shopify.html` の値を確定し、`python3 scripts/article_validator.py drafts/<handle>-shopify.html --brief drafts/<handle>-brief.md --source drafts/<handle>.html` を通常モードで実行してから `pre-publish-checker` → `article-publisher` を実行する。
- `needs_human_input`、`failed`、未確認事実、投入用コピーの残プレースホルダ、validator不合格、日本語品質・総合品質・法務の不合格のいずれかがあればShopify工程へ進めない。元原稿の公開用JSON-LDトークンは準備工程でコピー側を確定する。
- Shopify記事作成は必ず `isPublished: false`。公開操作は絶対に行わない。
- `pre-publish-checker` はブリーフの確定メタディスクリプションとJSON-LDの`Article.description`の完全一致を確認する。`article-publisher` は同じ値をShopifyの`global.description_tag`へ必ず設定し、作成後readbackで値・型・`isPublished: false`を確認する。欠落や不一致があれば完了扱いにしない。

## 実行原則
- 不合格時は後工程を止めて差し戻す。各ゲートの最大3周は初回を含む3回で、writerへ戻しても回数をリセットしない。再審査・下書きの例外はAGENTS.mdの「Gate Lifecycle And Draft Exceptions」に従う。
- 日本語editorの意味不変編集でも日本語審査以降の合格は失効する。writerの変更後は法務・validatorまで再合格させる。素材に影響する変更はasset計画も更新する。
- briefの質問対応表・用語計画・機械検証用メタデータ、sourcesの出典台帳、日本語審査の用語確認表、総合審査の回答品質ゲートを必須の受け渡し項目として確認する。
- 公開後の評価依頼はAGENTS.mdの `review-search-performance` に従う。未取得データを推定せず、評価から設計への戻し先を記録する。通常の下書き保存の完了条件へ公開後データを混ぜない。
- 各工程の成果物パスと合否を記録し、前工程の成果物がなければ後工程を起動しない。
- Rewrite後は影響範囲を自己判断で省略せず、上記の再実行チェーンを守る。
- Google Drive接続・認証がない場合は、その工程で停止して必要な接続を報告する。
- `review-human-draft` はAGENTS.mdの同名ワークフローに従い、`drive-draft-saver` を `reviewed_human_draft` モードで実行する。
"""
